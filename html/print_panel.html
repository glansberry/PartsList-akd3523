<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>

<head>
<!-- saved from url=(0014)about:internet -->
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
	<link rel="stylesheet" type="text/css" href="../stylesheets/partslist.css">
	<title>Print</title>
</head>

<body>
<form name="print_form" onsubmit="top.print_frames(this.data.checked, this.illustration.checked, this.linespacing.value, this.height.value, this.print_preview_width.value, this.print_preview_height.value);return false;">
<center><b>What to Print:</b>
<table width="95%" cellspacing="0" cellpadding="0" border="1" style="font-size:100%">
	<tbody>
		<tr>
			<td>Parts List (Upper) Frame</td>
			<td><input type="checkbox" name="data" checked></td>
		</tr>
		<tr>
			<td>Illustration (Lower) Frame</td>
			<td><input type="checkbox" name="illustration" checked></td>
		</tr>
	<tbody>
</table>

<br>

<b>Print Options:</b>
<table width="95%" cellspacing="0" cellpadding="0" border="1" style="font-size:100%">
	<tbody>
		<tr>
			<td>Line spacing:</td>
			<td colspan="2"><input type="text" name="linespacing" size="3" maxlength="3" value="240">%</td>
		</tr>
		<tr>
			<td>Image height:</td>
			<td colspan="2"><input type="text" name="height" size="4" maxlength="4" value="850" onChange="top._illustration_height=this.value">pixels</td>
		</tr>
		<tr>
			<td>Print Windows:</td>
			<td>W:</td>
			<td><input type="text" name="print_preview_width" size="4" maxlength="4" value="600">px</td>
		</tr>
		<tr>
			<td></td>
			<td>H:</td>
			<td><input type="text" name="print_preview_height" size="4" maxlength="4" value="400">px</td>
		</tr>
	<tbody>
</table>
<br>

<input type="submit" name="print" value="Print Preview"><br>
<input type="button" onClick="top.savePrintConfig()" value="Save Print Configuration">
</center>
</form>
</body>

</html>
