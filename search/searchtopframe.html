	<script language="javascript1.2" type="text/javascript">
	<!--  Copyright 2000 KScripts Web Consulting and Design. All rights reserved. Please do not copy without consent

// START CONFIGURATION	(DO NOT EDIT THIS LINE, NOT TO EVEN PUT A TAB IN FRONT OF IT. YOU HAVE BEEN WARNED!!)
var displaymatches = 10; // number of matches to display
var termlength = 3; // minimum term length
var displayfiletitle = 1; // set to 0 if you don't want the file title to be shown in results
var displayfiledescription = 0; // set to 0 if you don't want the file description to be shown in results
var displayfileurl = 0; // set to 0 if you don't want the file url to be shown in results
var displayfilematches = 1; // set to 0 if you don't want the matches per file to be shown in results
var displayfilesize = 0; // set to 0 if you don't want the file size to be shown in results
var displaylastupdated = 0; // set to 0 if you don't want the last updated date to be shown in results
var urlprefix = "../data/";    // where the manual resides
var style_sheet = "../stylesheets/partslist.css"; // url of style sheet
var remove_common_terms = 90; // maximum percentage of files that indexed terms can exist in
// END CONFIGURATION	(DO NOT EDIT THIS LINE, NOT TO EVEN PUT A TAB IN FRONT OF IT. YOU HAVE BEEN WARNED!!)

	function results (wantedpage) {
		if (parent.opener) {
			parent.opener.document.location.href = wantedpage;
			parent.opener.focus();
		} else {
			var windowsettings = "toolbar=yes,location=yes,directories=yes, status=yes,menubar=yes,scrollbars=yes,resizable=yes,copyhistory=yes";
			var newWindow = window.open(wantedpage,"New",windowsettings);
			newWindow.focus();
		}
	}
	var other, minus, plus;
	var currentmatch = 0;
	var mainframe = parent.frames[1].document;
	var sortedurls = new Array();
	var cleanquery = new Array();

//	function search (q, part_number) {
//	if (part_number) {
//		q = q.replace(/ /g, "")
//	}

	function search (q) {
		var notmatching = ""; // initialize variables
		other = "";
		minus = "";
		plus = "";
		q = q.replace(/\s+/g, " "); // remove extra spaces
		q = q.replace(/^\s+/g, ""); 
		q = q.replace(/\s+$/g, "");
		q = q.toLowerCase();	// switch to lower case
		var noplusminus = q.replace(/^[\-\+]/,"");
		if (noplusminus.length < termlength) {	// check term length
			alert("Term must be at least " + termlength + " characters long");
			document.searchform.query.focus();
			return;
		}
		var done = "";
		var isitanumber = /^[0-9]+$/;		// number regex
		cleanquery = clean(q.split(" "));	// remove repeating terms
		for (i=0;i<cleanquery.length;i++) {	// process each term
			var cleaned = cleanquery[i];
			if (isitanumber.test(cleaned)) {	// add # in front of numbers
				cleaned = "#" + cleaned;
			}
			if (cleanquery[i].charAt(0) == "+" && cleanquery[i].length > 1) {	// get plus boolean terms
				cleaned = cleanquery[i].replace(/^\+/,"");
				if (isitanumber.test(cleaned)) {
					cleaned = "#" + cleaned;
				}
				if (w[cleaned]) {
					plus += " " + w[cleaned];
				} else {
					notmatching += " " + cleanquery[i];
				}
				continue;
			}
			if (cleanquery[i].charAt(0) == "-" && cleanquery[i].length > 1) { // get minus boolean terms
				cleaned = cleanquery[i].replace(/^\-/,"");
				if (isitanumber.test(cleaned)) {
					cleaned = "#" + cleaned;
				}
				if (w[cleaned]) {
					minus += "|" + w[cleaned];
				} 
				continue;
			}
			if (w[cleaned]) {
				other += " " + w[cleaned];
			} else {
				notmatching += " " + cleanquery[i];
			}
		}
	//	document.searchform.query.value=cleanquery.join(" ");
		if (notmatching) {
			notmatching = notmatching.replace(/^\s+/, "");
			notmatching = notmatching.split(" ");
		}
		process_booleans(notmatching);
	}

	function process_booleans(notmatching) {
		var a = "";
		var allurlstrings = "";
		var nextinloop = "";
		if (notmatching.length >= 1) { noresults(notmatching); return; }
		if (other) {
			other = other.replace(/^\s+/, "");
			other = other.split(" ");
			for (j=0;j<other.length;j++) {	// process other terms
				var urlstrings = other[j].split("|");
				for (k=0;k<urlstrings.length;k++) {
					allurlstrings += " " + urlstrings[k]; 
				}
			}
		}
		if (plus) {
			plus = plus.replace(/^\s+/, "");
			plus = plus.split(" ");
			for (j=0;j<plus.length;j++) {	// process plus boolean terms
				var turlslist = "";
				var urlslist = "";
				var urlstrings = plus[j].split("|"); 
				for (k=0;k<urlstrings.length;k++) {
					allurlstrings += " " + urlstrings[k]; 
					var breakup = urlstrings[k].split("=");
					urlslist += " " + breakup[0];
				}
				urlslist = urlslist.replace(/^\s+/,"");
				urlslist = urlslist.split(" ");
				if (!nextinloop) { var allwordsurls = urlslist; nextinloop = 1; continue;}
				for (l=0;l<urlslist.length;l++) {
					for (m=0;m<allwordsurls.length;m++) {
						if (urlslist[l] == allwordsurls[m]) {
							turlslist += " " + urlslist[l];
						}
					}
				}
				turlslist = turlslist.replace(/^\s+/,"");
				turlslist = turlslist.split(" ");
				var allwordsurls = turlslist;
			}
			allurlstrings = allurlstrings.replace(/^\s+/,"");
			allurlstrings = allurlstrings.split(" ");
			for (n=0;n<allurlstrings.length;n++) {
				var breakup = allurlstrings[n].split("=");
				for (o=0;o<allwordsurls.length;o++) {
					if (breakup[0] == allwordsurls[o]) {
						a += " " + allurlstrings[n];
					}
				}
			}
		} else {
			a = allurlstrings;
		}
		if (minus) {	// process minus booleans
			var atemp = "";
			minus = minus.replace(/^\|/,"");
			minus = minus.split("|");
			var minusurls = geturls(minus);
			a = a.replace(/^\s+/,"");
			a = a.split(" ");
			outerloop:
			for (n=0;n<a.length;n++) {
				var breakup = a[n].split("=");
				for (o=0;o<minusurls.length;o++) {
					if (breakup[0] == minusurls[o]) {
						continue outerloop;
					}
				}	
				atemp += " " + a[n];
			}
			a = atemp;
		}
		a = a.replace(/^\s+/,"");
		a = a.split(" ");
		a = a.join("|");
		if (a) {
			process(a);
		} else {
			noresults(cleanquery);  
		}
	}
	function noresults (q) {
		var noresults = "";
		var newcleanquery = "";
		for (h=0;h<cleanquery.length;h++) {
			var match = "";
			for (g=0;g<q.length;g++) {
				if (cleanquery[h] == q[g]) {
					match = 1;
				}
			}
			if (!match) {newcleanquery += " " + cleanquery[h];}
		}	
		newcleanquery = newcleanquery.replace(/^\s+/,"");
		noresults = q.join(" ");
		if (q.length == 1) { 
			if (newcleanquery) {
				var finalnoresults = q[0] + "  \nContinuing without this term";
				alert ("Cannot find: " + finalnoresults);		
			} else {
				var finalnoresults = q[0];
				alert ("No documents match: " + finalnoresults + ".\nThis is either because the term was not found or is in more than " + remove_common_terms + "% of the Part List pages");
			}
		}
		if (q.length > 1) {
			if (newcleanquery) {
				noresults += "  \nContinuing without these terms";
				alert ("Cannot find: " + noresults);
			} else {
				alert ("No documents match: " + noresults);
			}
		}
		if (newcleanquery) {
			search(newcleanquery);
		}
		document.searchform.query.focus();
		document.searchform.query.select();
		return;
	}
	function process (a) {
		var sorturls = "";
		var urls = new Array();
		var query = a.split("|");
		urls = geturls(query);
		for (j=0;j<urls.length;j++) {		// This for loop eliminates duplicate urls from the search results
			var total = new Number();
			var n = 0;
			for (k=0;k<query.length;k++) {
				urlinfo = query[k].split("=");
				if (urlinfo[0] != urls[j]) { continue;}
				n = parseFloat(urlinfo[1]);
				total += n;
			}
			sorturls += " " + (total + "|" + urls[j]);
		}
		var arethereurls = sorturls;
		sorturls = sorturls.replace(/^\s+/,"");
		var urls_to_sort = new Array();
		split_urls = sorturls.split(" ")
		for (j=0;j<split_urls.length;j++) {
			temp = split_urls[j].split("|")		//temp is an array containing 2 elements: [0]: # Matches; [1]: Document # in u
			splitrecord = u[temp[1]].split("|")		//splitrecord is an array containing the elements of u[]
			urls_to_sort[j] = temp[0] + "|" + temp[1] + "|" +  splitrecord[2]  //sorturls is an array with the form: #Matches|Document#|Description in each element
		}
		sortedurls = urls_to_sort.sort(bynumber);
		if (!arethereurls) {
			noresults(cleanquery);
		} else {
			display(sortedurls, currentmatch, displaymatches);
		}

	}

	function bynumber(a,b) {
		c = a.split("|");
		d = b.split("|");
		return c[2] - d[2]													// This return sorts if 'Description' (urls_to_sort[2]) is a number
	//	return ((c[2] < d[2]) ? -1 : ((c[2] > d[2]) ? 1 : 0));	// This return sorts if 'Description' (urls_to_sort[2]) is a string
	//	return d[0] - c[0]
	}
	function clean(q) {
		var s = "";
		var c = new Array();
		var t = new Array();
		for (i=0;i<q.length;i++) {
			if (!t[q[i]]) { s += " " + q[i] ; t[q[i]] = 1;}
		}
		s = s.replace(/^[\s]+/, "");
		c = s.split(" ");
		return c;
	}
	function geturls (query) {
		var urls = ""; 
		var t = new Array();
		for (z=0;z<query.length;z++) {
			urlinfo = query[z].split("=");
			if (!t[urlinfo[0]]) { urls += " " + urlinfo[0]; t[urlinfo[0]] = 1;}
		}
		urls = urls.replace(/^\s+/,"");
		urls = urls.split(" ");
		return urls;
	}
	function display(urls, ref, dif) {
		var displaynumber = (urls.length < ref + dif ? urls.length : ref + dif);
		mainframe = parent.frames[1].document;
		mainframe.open();
		if (urls.length == 0) {
			mainframe.writeln('<html><head>\n<title>Lost Search Data</title>\n' +
			'<LINK REL="stylesheet" TYPE="text/css" HREF="' + style_sheet + '" TITLE="style">\n</head>\n' +
			'<body bgcolor=white text=black>' + 
			'<table width=95% border=0 align=center cellpadding=3 cellspacing=0><tr><td align=center nowrap>' + 
			'<BR><BR><P><B>Lost Data. Please Resubmit Your Query.</B></P>' + 
			'<P><B>(Click the Search Button)</B></P></td></tr></table></body></html>');
			mainframe.close();
			return;
		}
		mainframe.writeln('<html>');
		mainframe.writeln('<head>');
		mainframe.writeln('\t<title>Search Results</title>');
		mainframe.writeln('\t<link rel="stylesheet" type="text/css" href="' + style_sheet + '">');
		mainframe.writeln('</head>\n');
		mainframe.writeln('<body bgcolor="white">');
		mainframe.writeln('<table class="search_result_table" width=100% border=0>');
//		mainframe.writeln('<table class="normal" width=100% border=0>');
		mainframe.writeln('\t<tr>');
		mainframe.writeln('\t\t<td>');
//		mainframe.writeln('\t\t<td class="results">');
		mainframe.writeln('\t\t\t<b>Search Terms: ' + parent.frames[0].document.searchform.query.value + '<br>');

		if (ref + 1 == displaynumber) {
			mainframe.writeln('\t\t\tResults: ' + displaynumber + ' of ' + urls.length);
		} else {
			mainframe.writeln('\t\t\tResults: ' + (ref + 1) + ' - ' + displaynumber + ' of ' + urls.length);
		}
		mainframe.writeln('</B>');
		mainframe.writeln('</td>');
		mainframe.writeln('</tr>');
		mainframe.writeln('<tr><td align=right nowrap>');
//		mainframe.writeln('<tr><td class="results" align=right nowrap>');
		prevnext(urls.length, ref, dif, "top");
		mainframe.writeln('</td></tr>\n' + '\n<!-- // start search results list // -->\n\n');
		mainframe.writeln('</table>');

		mainframe.writeln('<table class="search_result_table" width=100% border=1>');
	//alert("urls:"+urls)
		for (var i=ref;i<displaynumber;i++) {
			searchresults = urls[i].split("|");
	//alert("searchresults:"+searchresults)
			urlinfo = u[searchresults[1]];
			temparray = urlinfo.split("|");
			title_array = temparray[1].split(";");
	//alert("temparray: "+temparray[1])
	//alert("title_array: "+title_array[0])
			mainframe.writeln('<tr>');
			mainframe.writeln('\t<td class="search_result">');
			if (displayfiletitle) {
				mainframe.writeln('\t\t<a href="' + urlprefix +	temparray[0] + '" target="partslist">' + title_array[1] + '</a>');
//				mainframe.writeln('\t\t<a href="' + urlprefix +	temparray[0] + '" target="partslist">' + temparray[1] + '</a>');
//				mainframe.writeln('\t\t<a class="search_result_link" href="' + urlprefix +	temparray[0] + '" target="partslist">' + temparray[1] + '</a>');
			}
			if (displayfiledescription) {
				mainframe.writeln('		<DD>' + temparray[2] + '...\n');  // This line prints the description of the resource
			}
			if (displayfileurl) {			// These lines print the URL of the resource
				mainframe.writeln('		<DD><a href="' + urlprefix + temparray[0] + '" class="search_results" onclick="parent.frames[0].results(\'' + urlprefix + temparray[0] + '\')\;return false\;" target="_blank"><font size=1>' + urlprefix + temparray[0] + '</font></a>\n');
			}
			if (displayfilematches || displayfilesize || displaylastupdated) {	// if any of matches, filesize or last updates have been set to appear
				mainframe.writeln('\t\t<br><matches><B>');
				if (displayfilematches) {
					if (searchresults[0] == "1" && searchresults[0] != "0") { mainframe.writeln('		' + searchresults[0] + ' Match ');}
					if (searchresults[0] != "1" && searchresults[0] != "0") { mainframe.writeln('		' + searchresults[0] + ' Matches '); }
				}
				if (displayfilesize) { mainframe.writeln('		&nbsp; Size: ' + temparray[3] + ' kb ');}
				if (displaylastupdated) { mainframe.writeln('		&nbsp; Last Updated: ' + temparray[4]);}
				mainframe.writeln('\t\t</B></matches>');
			}
			mainframe.writeln('\t</td>');
			if (displayfiletitle && title_array[0]) {
				mainframe.writeln('\t<td class="search_result">');
				page_ref = title_array[0]
				page_ref = page_ref.replace(/^ /, "");
				page_ref = page_ref.replace(/ /g, "&nbsp;");
				mainframe.writeln('\t\t<a href="' + urlprefix +	temparray[0] + '" target="partslist">' + page_ref + '</a>');
				mainframe.writeln('\t</td>');
			}
			mainframe.writeln('</tr>');
		}
		mainframe.writeln('</table>');

		mainframe.writeln('<table width=100% border=0 align=center cellpadding=5 cellspacing=0>');
		mainframe.writeln('<tr><td nowrap><P>');
//		mainframe.writeln('<tr><td class="results" nowrap><P>');
		if (urls.length - ref > 4) {
			prevnext(urls.length, ref, dif, "bottom");
		}
		mainframe.writeln('</P></td></tr>');
	//	mainframe.writeln('<tr><td align="center"></td></tr>\n');
	//	mainframe.writeln('<tr><td>&nbsp;</td></tr><tr><td class="copyright"><center><font size=1>KSearch Client Side by kscripts.com<br>KScripts.com  &copy; Copyright 2000, All rights reserved</font></center></td></tr>\n');
		mainframe.writeln('</table>');
		mainframe.writeln('<center><a href="javascript:top.search_text();"><l2assy>Return To Main Menu</l2assy></a></center>');
		mainframe.writeln('</body></html>');
		mainframe.close();
		parent.frames[0].document.searchform.query.focus();
		parent.frames[0].document.searchform.query.select();
	}
	function prevnext (top, ref , dif, location) {
		if (location == "top") {
			mainframe.writeln('<form>');
		} else {
			mainframe.writeln('<center><form>');
		}
		if (ref > 0) {
			mainframe.writeln('<input type=button value="Previous ' + dif + '" ' +
			'onClick="parent.frames[0].display(parent.frames[0].sortedurls, ' +
			(ref - dif) + ', ' + dif + ')">');
		}
		if (ref >= 0 && ref + dif < top) {
			var ttop = ((top - (dif + ref) < dif) ? top - (ref + dif) : dif);
			mainframe.writeln(' &nbsp; <input type=button value="Next ' + ttop + '" ' + 
			'onClick="parent.frames[0].display(parent.frames[0].sortedurls, ' +
			(ref + dif) + ', ' + dif + ')">');
		}
		if (location == "top") {
			mainframe.writeln('</form>\n');
		} else {
			mainframe.writeln('</form></center>\n');
		}
	}
	// END OF SEARCH SCRIPT -->
	</script>
